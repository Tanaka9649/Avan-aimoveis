name: Release validated preview
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  preview-and-promote:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Production safety gate
        run: |
          echo "Release disabled: configure isolated environments and a production-target staged artifact before enabling promotion."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test
      - run: npm install --global vercel@59.20.0
      - run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - id: deploy
        shell: bash
        run: echo "url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Apply versioned migrations
        run: npm run db:migrate
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}
      - name: Smoke test preview
        shell: bash
        run: curl --fail --retry 4 --retry-delay 5 "${{ steps.deploy.outputs.url }}/api/health"
      - name: Promote validated artifact
        run: vercel promote "${{ steps.deploy.outputs.url }}" --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Post-deploy smoke test
        shell: bash
        run: curl --fail --retry 4 --retry-delay 5 "${{ secrets.PRODUCTION_URL }}/api/health"
