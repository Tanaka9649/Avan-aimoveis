name: CI
on:
  pull_request:
  push:
    branches: ['**']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --save-exact next@16.4.0 eslint-config-next@16.4.0 sharp@0.35.5
      - run: npm audit fix --package-lock-only --omit=dev
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-refresh
          path: |
            package.json
            package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://preview.example.com
      - run: npx --no-install drizzle-kit check
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - run: npm audit --omit=dev --audit-level=high
